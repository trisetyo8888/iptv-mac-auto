name: Perbarui MAC Portal Otomatis

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 

jobs:
  update-link:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install requests

- name: Run Python Script
      run: update_portal.py  
      
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Skenario 1: Menambahkan file hasil skrip Anda secara spesifik
        # Jika skrip Anda menghasilkan mac_playlist.m3u, gunakan nama tersebut
        git add mac_playlist.m3u || git add playlist.m3u
        
        # Skenario 2: Atau menambahkan semua perubahan yang ada di direktori kerja
        # git add .
        
        # Memeriksa apakah ada perubahan yang siap di-commit agar tidak memicu Exit Code 1
        if git diff-index --quiet HEAD --; then
          echo "Tidak ada perubahan data playlist yang baru. Melewati proses commit."
        else
          git commit -m "Daftar putar otomatis diperbarui [Automated]"
          git push origin main
        fi
